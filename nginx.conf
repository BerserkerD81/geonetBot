# Redirige todo el tráfico que llegue por el puerto 8080 a HTTPS
server {
  listen 8080;
  server_name _;
  return 301 https://$host$request_uri;
}
server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  # Redirige todo el tráfico HTTP a HTTPS
  return 301 https://$host$request_uri;


# ==========================================
# BLOQUE HTTPS CON SSL/TLS SEGURO
# ==========================================
server {
  listen 443 ssl http2;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  # Rutas y configuración igual al bloque HTTP
  # ...existing code...

  # Rutas frontend y backend
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable, max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-XSS-Protection "1; mode=block" always;
  }
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-XSS-Protection "1; mode=block" always;
  }
  location /api/ {
    proxy_hide_header Strict-Transport-Security;
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }
  location /uploads/ {
    proxy_pass http://api:3000/uploads/;
  }

  # ==========================================
  # SSL/TLS SEGURO
  # ==========================================
  ssl_certificate /etc/letsencrypt/live/tu-dominio/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tu-dominio/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
  ssl_ecdh_curve X25519:secp384r1:secp521r1:secp256k1;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1h;
  ssl_session_tickets off;
  ssl_stapling on;
  ssl_stapling_verify on;
  resolver 1.1.1.1 8.8.8.8 valid=300s;
  resolver_timeout 5s;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
}
  # ==========================================
  # MEDIDAS ANTI-DDOS Y HARDENING BÁSICO
  # ==========================================
  
  # 1. Oculta la versión de Nginx en los errores (Seguridad por oscuridad)
  server_tokens off;

  # 2. Limita el tamaño máximo del cuerpo de la petición. 
  # Esto evita que un atacante sature el servidor subiendo archivos gigantes.
  client_max_body_size 10M;

  # 3. Timeouts (Protección contra ataques "Slowloris")
  # Cierra las conexiones de atacantes que intentan mantener conexiones abiertas enviando datos muy lento.
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 15s;
  send_timeout 10s;

  # ==========================================
  # RUTAS Y CACHÉ DEL FRONTEND (Vite/React)
  # ==========================================

  # 1. ASSETS ESTÁTICOS: Caché agresivo para JS, CSS e imágenes generadas por Vite.
  # Al tener un hash en el nombre (ej. index-BFLFQlrx.js), nunca habrá conflictos.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable, max-age=31536000" always;
    
    # Mantenemos seguridad básica para los assets
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-XSS-Protection "1; mode=block" always;
  }

  # 2. RUTA PRINCIPAL (index.html): Sin caché y con seguridad estricta.
  # Asegura que React maneje las rutas (SPA) y que los usuarios siempre bajen la última versión.
  location / {
    try_files $uri $uri/ /index.html;
    
    # Bloqueamos el caché estrictamente aquí
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    # Encabezados de seguridad requeridos por ZAP
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-XSS-Protection "1; mode=block" always;
  }

  # ==========================================
  # API Y UPLOADS (Backend Express)
  # ==========================================

  # Captura todo lo que vaya a /api/
  location /api/ {
    # Evita que el backend envíe su propio HSTS y cause un duplicado en ZAP
    proxy_hide_header Strict-Transport-Security;

    # La barra al final de 3000/ es la que ELIMINA el "/api/" antes de llegar al Express
    proxy_pass http://api:3000/; 
    
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Evitar timeouts en procesos largos (auth, sync, etc.)
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  # Para ver las fotos subidas por los técnicos
  location /uploads/ {
    proxy_pass http://api:3000/uploads/;
  }
}
