server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

     # Encabezados de seguridad mejorados
     add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self';" always;
     add_header X-Frame-Options "DENY" always;
     add_header X-Content-Type-Options "nosniff" always;
     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
     add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
     add_header Pragma "no-cache" always;
     add_header Expires "0" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Captura todo lo que vaya a /api/
  location /api/ {
    # La barra al final de 3000/ es la que ELIMINA el "/api/" antes de llegar al Express
    proxy_pass http://api:3000/; 
    
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Evitar timeouts en procesos largos (auth, sync, etc.)
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  # IMPORTANTE: Para ver las fotos de los técnicos
  location /uploads/ {
    proxy_pass http://api:3000/uploads/;
  }
}
