server {
  # Solo escucha en el puerto 80 (NPM se comunicará con este puerto internamente)
  listen 80;
  server_name localhost;
  
  root /usr/share/nginx/html;
  index index.html;

  # ==========================================
  # MEDIDAS ANTI-DDOS Y HARDENING BÁSICO
  # ==========================================
  server_tokens off;
  client_max_body_size 10M;
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 15s;
  send_timeout 10s;

  # ==========================================
  # CABECERAS DE SEGURIDAD GLOBALES
  # ==========================================
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://jmm.geonet.cl; img-src 'self' data: https:;" always;

  # ==========================================
  # RUTAS Y CACHÉ DEL FRONTEND (Vite/React)
  # ==========================================

  # 1. ASSETS ESTÁTICOS
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable, max-age=31536000" always;
    
    # Repetimos seguridad por la regla de herencia de Nginx
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://jmm.geonet.cl; img-src 'self' data: https:;" always;
  }

  # 2. RUTA PRINCIPAL (index.html) - SPA
  location / {
    try_files $uri $uri/ /index.html;
    
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    # Repetimos seguridad por la regla de herencia de Nginx
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://jmm.geonet.cl; img-src 'self' data: https:;" always;
  }

  # ==========================================
  # API Y UPLOADS (Backend Express)
  # ==========================================

  location /api/ {
    # BLOQUEO DE NAVEGACIÓN DIRECTA (Opcional, evita ver JSON en barra de direcciones)
    if ($http_sec_fetch_mode = "navigate") {
        return 301 https://jmm.geonet.cl/;
    }

    proxy_hide_header Strict-Transport-Security;
    proxy_pass http://api:3000/; 
    
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # CORRECCIÓN CRÍTICA: Pasar el protocolo original (https) de NPM al Backend
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  location /uploads/ {
    proxy_pass http://api:3000/uploads/;
  }
}
