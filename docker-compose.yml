services:
  dev:
    build:
      context: .
      target: base
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    networks:
      - geonet_network
    command: npm run dev -- --host

  prod:
    build:
      context: .
      target: production
      args:
        # Si el backend también está en geonet_network, 
        # aquí podrías usar el nombre del servicio del backend
        VITE_API_URL: "/api"
    ports:
      - "8080:80"
    networks:
      - geonet_network

volumes:
  node_modules:

networks:
  geonet_network:
    external: true
