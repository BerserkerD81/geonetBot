services:
  dev:
    build:
      context: .
      target: base
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: npm run dev -- --host

  prod:
    build:
      context: .
      target: production
    ports:
      - "8080:80"

volumes:
  node_modules:
