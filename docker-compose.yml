services:
  dev:
    build:
      context: .
      target: base
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    networks:
      - geonet_network
    command: npm run dev -- --host
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5173/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  prod:
    build:
      context: .
      target: production
      args:
        # Si el backend también está en geonet_network, 
        # aquí podrías usar el nombre del servicio del backend
        VITE_API_URL: "/api"
    ports:
      - "8080:80"
    networks:
      - geonet_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
volumes:
  node_modules:

networks:
  geonet_network:
    external: true
