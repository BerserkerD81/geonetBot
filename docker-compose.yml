services:
  dev:
    build:
      context: .
      target: base
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: npm run dev -- --host

  prod:
    build:
      context: .
      target: production
      args:
        # Replace with your backend public URL (include protocol)
        VITE_API_URL: "http://localhost:3000"
    ports:
      - "8080:80"

volumes:
  node_modules:
